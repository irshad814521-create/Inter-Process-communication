<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IPC Simulation</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#14213d;--mut:#5b6b85;--ac:#0a84d6;--ac2:#10a36b;--bad:#d64545;--line:#cfd9e8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#070d1a;--card:#0f1a2e;--ink:#e6f0ff;--mut:#8aa0c4;--ac:#38bdf8;--ac2:#34d399;--bad:#f87171;--line:#23365a}}
:root[data-theme="dark"]{--bg:#070d1a;--card:#0f1a2e;--ink:#e6f0ff;--mut:#8aa0c4;--ac:#38bdf8;--ac2:#34d399;--bad:#f87171;--line:#23365a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:820px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:4px 0}
.sub{color:var(--mut);margin:0 0 12px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}
.tabs button,.ctl button,.ctl select{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 12px;border-radius:8px;cursor:pointer;white-space:nowrap}
.tabs button.on{background:var(--ac);border-color:var(--ac);color:#04121f;font-weight:600}
.ctl button:hover{border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:10px}
#desc{margin:0;color:var(--mut)}
svg{width:100%;height:auto;display:block}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.ctl label{color:var(--mut)}
#log{list-style:none;margin:0;padding:0;max-height:170px;overflow:auto;font:13px/1.6 ui-monospace,Menlo,Consolas,monospace}
#log li{border-bottom:1px dashed var(--line);padding:2px 0}
#log .bad{color:var(--bad)}#log .ok{color:var(--ac2)}
.t{fill:var(--ink);font:12px system-ui,sans-serif}.m{fill:var(--mut);font:11px system-ui,sans-serif}
</style></head><body><main>
<h1>Inter-Process Communication Simulator</h1>
<p class="sub">Process A and Process B cannot see each other’s memory, so the OS gives them channels. Pick one and try it.</p>
<div class="tabs" id="tabs"></div>
<div class="card"><p id="desc"></p>
<svg id="s" viewBox="0 0 700 300" role="img" aria-label="IPC animation"></svg>
<div class="ctl" id="ctl"></div></div>
<div class="card"><b>Event log</b><ul id="log"></ul></div>
</main>
<script>
const NS="http://www.w3.org/2000/svg",S=document.getElementById("s");
const $=id=>document.getElementById(id);
function el(t,a,p,txt){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(txt!==undefined)e.textContent=txt;(p||S).appendChild(e);return e}
function log(m,c){const li=document.createElement("li");li.textContent=m;if(c)li.className=c;$("log").prepend(li)}
const MODES=[["Pipes","pipe"],["Message passing","mq"],["Shared memory","shm"],["Sockets","sock"],["Signals","sig"]];
const DESC={
pipe:"A pipe is a one-way FIFO byte stream. A writes, B reads in the same order. If the pipe is full the writer blocks; if empty the reader blocks.",
mq:"Message passing uses a kernel-managed queue of discrete, typed messages. B can receive any message or only a chosen type.",
shm:"Shared memory maps one region into both processes, so it is the fastest option, but you need a lock to avoid race conditions.",
sock:"Sockets give two-way client/server communication, even across machines. Connect first (3-way handshake), then exchange data.",
sig:"Signals are tiny asynchronous notifications. B can install a handler, except for SIGKILL which cannot be caught."};
let mode,busy=false,st={},dyn;
function css(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim()}
function proc(x,name,col){el("rect",{x,y:90,width:120,height:120,rx:14,fill:"none",stroke:col,"stroke-width":2},dyn);
 el("text",{x:x+60,y:140,"text-anchor":"middle","font-size":34},dyn,"🤖");
 el("text",{x:x+60,y:176,"text-anchor":"middle",class:"t"},dyn,name);
 return el("text",{x:x+60,y:196,"text-anchor":"middle",class:"m"},dyn,"")}
function dot(x1,y1,x2,y2,label,col,ms=900){return new Promise(res=>{
 const g=el("g",{},dyn),c=el("circle",{r:11,fill:col},g),t=el("text",{"text-anchor":"middle",y:-16,class:"m"},g,label);
 const t0=performance.now();(function f(n){const k=Math.min(1,(n-t0)/ms);
 g.setAttribute("transform",`translate(${x1+(x2-x1)*k},${y1+(y2-y1)*k})`);
 k<1?requestAnimationFrame(f):(g.remove(),res())})(t0)})}
function lock(f){return async()=>{if(busy)return;busy=true;try{await f()}finally{busy=false}}}
function ctl(items){const c=$("ctl");c.innerHTML="";items.forEach(i=>{
 if(i.sel){const l=document.createElement("label");l.textContent=i.label+" ";const s=document.createElement("select");s.id=i.id;i.sel.forEach(o=>s.add(new Option(o,o)));l.appendChild(s);c.appendChild(l)}
 else if(i.chk){const l=document.createElement("label");const k=document.createElement("input");k.type="checkbox";k.id=i.id;k.checked=true;l.append(k," "+i.label);c.appendChild(l)}
 else{const b=document.createElement("button");b.textContent=i.label;b.onclick=i.fn;c.appendChild(b)}})}
function setMode(m){mode=m;busy=false;st={};S.innerHTML="";dyn=el("g",{});
 [...$("tabs").children].forEach(b=>b.classList.toggle("on",b.dataset.m===m));
 $("desc").textContent=DESC[m];$("log").innerHTML="";
 const A=css("--ac"),B=css("--ac2");
 ({pipe,mq,shm,sock,sig})[m](A,B)}

/* ---------- PIPE ---------- */
function pipe(A,B){const a=proc(20,"Process A (writer)",A),b=proc(560,"Process B (reader)",B);
 el("rect",{x:160,y:130,width:380,height:40,rx:20,fill:"none",stroke:css("--line"),"stroke-width":3},dyn);
 el("text",{x:350,y:122,"text-anchor":"middle",class:"m"},dyn,"pipe (capacity 5, FIFO)");
 st.buf=[];st.n=0;const g=el("g",{},dyn);const pos=i=>510-i*66;
 const draw=()=>{g.innerHTML="";st.buf.forEach((v,i)=>{el("circle",{cx:pos(i),cy:150,r:14,fill:A},g);el("text",{x:pos(i),y:154,"text-anchor":"middle",class:"t",fill:"#04121f",style:"fill:#04121f"},g,v)})};
 ctl([{label:"A: write()",fn:lock(async()=>{
  if(st.buf.length>=5){a.textContent="BLOCKED (full)";log("write() blocks: pipe is full","bad");return}
  const v="d"+(++st.n);a.textContent="writing "+v;await dot(140,150,pos(st.buf.length),150,v,A);st.buf.push(v);draw();log("A wrote "+v+" (queued: "+st.buf.length+")");a.textContent=""})},
  {label:"B: read()",fn:lock(async()=>{
  if(!st.buf.length){b.textContent="BLOCKED (empty)";log("read() blocks: pipe is empty","bad");return}
  b.textContent="";const v=st.buf.shift();draw();await dot(pos(0),150,560,150,v,B);log("B read "+v+" (oldest first)","ok")})}])}

/* ---------- MESSAGE QUEUE ---------- */
function mq(A,B){proc(20,"Process A (sender)",A);proc(560,"Process B (receiver)",B);
 el("rect",{x:170,y:110,width:360,height:80,rx:10,fill:"none",stroke:css("--line"),"stroke-width":2,"stroke-dasharray":"6 4"},dyn);
 el("text",{x:350,y:102,"text-anchor":"middle",class:"m"},dyn,"kernel message queue");
 st.q=[];st.n=0;const g=el("g",{},dyn);
 const draw=()=>{g.innerHTML="";st.q.forEach((m,i)=>{const x=180+i*60;el("rect",{x,y:125,width:52,height:50,rx:6,fill:m.t==1?A:B},g);
  el("text",{x:x+26,y:147,"text-anchor":"middle",style:"fill:#04121f;font:600 11px system-ui"},g,"#"+m.id);el("text",{x:x+26,y:164,"text-anchor":"middle",style:"fill:#04121f;font:11px system-ui"},g,"type "+m.t)})};
 ctl([{label:"Type",id:"ty",sel:["1","2"]},
  {label:"A: send()",fn:lock(async()=>{if(st.q.length>=6){log("queue full: sender waits","bad");return}
   const t=+$("ty").value,id=++st.n;await dot(140,150,180+st.q.length*60+26,150,"#"+id,t==1?A:B);st.q.push({id,t});draw();log("A sent message #"+id+" (type "+t+")")})},
  {label:"Receive",id:"rt",sel:["any","1","2"]},
  {label:"B: receive()",fn:lock(async()=>{const w=$("rt").value;const i=st.q.findIndex(m=>w=="any"||m.t==+w);
   if(i<0){log("no matching message: receiver waits","bad");return}
   const m=st.q.splice(i,1)[0];draw();await dot(350,150,560,150,"#"+m.id,B);log("B received #"+m.id+" (type "+m.t+")","ok")})}])}

/* ---------- SHARED MEMORY ---------- */
function shm(A,B){proc(20,"Process A",A);proc(560,"Process B",B);
 el("text",{x:350,y:62,"text-anchor":"middle",class:"m"},dyn,"shared memory region (mapped into both)");
 st.v=Array(6).fill("–");const g=el("g",{},dyn);
 const draw=bad=>{g.innerHTML="";st.v.forEach((v,i)=>{const x=190+i*54;el("rect",{x,y:120,width:48,height:60,rx:6,fill:"none",stroke:bad===i?css("--bad"):css("--line"),"stroke-width":2},g);
  el("text",{x:x+24,y:155,"text-anchor":"middle",class:"t"},g,v);el("text",{x:x+24,y:196,"text-anchor":"middle",class:"m"},g,"["+i+"]")})};draw();
 const cell=()=>+$("c").value;
 ctl([{label:"Cell",id:"c",sel:["0","1","2","3","4","5"]},
  {label:"A: write",fn:lock(async()=>{const i=cell(),v=Math.floor(Math.random()*90+10);await dot(140,150,190+i*54+24,150,v,A,500);st.v[i]=v;draw();log("A wrote "+v+" to ["+i+"] (no copy through kernel)")})},
  {label:"B: read",fn:lock(async()=>{const i=cell();await dot(190+i*54+24,150,560,150,st.v[i],B,500);log("B read "+st.v[i]+" from ["+i+"]","ok")})},
  {label:"Use lock",id:"lk",chk:1},
  {label:"A and B write same cell at once",fn:lock(async()=>{const i=cell();
   await Promise.all([dot(140,150,190+i*54+24,140,"A",A,500),dot(560,150,190+i*54+24,160,"B",B,500)]);
   if($("lk").checked){st.v[i]="B";draw();log("lock held: writes were serialised, A then B. Final value is consistent.","ok")}
   else{st.v[i]="??";draw(i);log("RACE CONDITION: both wrote with no lock, so the value is corrupted","bad")}})}])}

/* ---------- SOCKET ---------- */
function sock(A,B){const a=proc(20,"Client",A),b=proc(560,"Server",B);
 const stt=el("text",{x:350,y:60,"text-anchor":"middle",class:"t"},dyn,"state: CLOSED");
 el("line",{x1:150,y1:150,x2:550,y2:150,stroke:css("--line"),"stroke-width":2,"stroke-dasharray":"4 6"},dyn);
 st.c=false;const set=s=>stt.textContent="state: "+s;
 ctl([{label:"Connect (handshake)",fn:lock(async()=>{if(st.c){log("already connected","bad");return}
   set("SYN_SENT");await dot(140,150,560,150,"SYN",A,700);log("Client → Server: SYN");
   await dot(560,150,140,150,"SYN-ACK",B,700);log("Server → Client: SYN-ACK");
   await dot(140,150,560,150,"ACK",A,700);log("Client → Server: ACK","ok");st.c=true;set("ESTABLISHED")})},
  {label:"Send request",fn:lock(async()=>{if(!st.c){log("not connected: connect first","bad");return}
   await dot(140,150,560,150,"GET /",A,800);log("Client sent request");await dot(560,150,140,150,"200 OK",B,800);log("Server replied (two-way channel)","ok")})},
  {label:"Close",fn:lock(async()=>{if(!st.c){log("socket is not open","bad");return}
   await dot(140,150,560,150,"FIN",A,600);await dot(560,150,140,150,"ACK",B,600);st.c=false;set("CLOSED");log("connection closed","ok")})}])}

/* ---------- SIGNALS ---------- */
function sig(A,B){proc(20,"Process A (sender)",A);const b=proc(560,"Process B (target)",B);
 st.dead=false;const H={SIGINT:"handler: flush buffers, then exit",SIGTERM:"handler: graceful shutdown",SIGUSR1:"custom handler: reload config",SIGKILL:null};
 ctl([{label:"Signal",id:"sg",sel:Object.keys(H)},
  {label:"A: kill(B, signal)",fn:lock(async()=>{if(st.dead){log("B is already terminated","bad");return}
   const s=$("sg").value;await dot(140,150,560,150,s,css("--bad"),700);log("A sent "+s);
   if(H[s]===null){st.dead=true;b.textContent="terminated";log("SIGKILL cannot be caught or ignored: B was killed by the OS","bad")}
   else{b.textContent="handling "+s;log("B "+H[s],"ok");setTimeout(()=>b.textContent="",1200)}})},
  {label:"Restart B",fn:()=>{st.dead=false;b.textContent="";log("B restarted")}}])}

MODES.forEach(([n,k])=>{const b=document.createElement("button");b.textContent=n;b.dataset.m=k;b.onclick=()=>setMode(k);$("tabs").appendChild(b)});
setMode("pipe");
</script></body></html>
